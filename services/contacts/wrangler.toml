name = "contacts"
main = "src/index.ts"
compatibility_date = "2025-06-01"
# Internal-only: reachable only via the gateway's CONTACTS_SERVICE binding.
# `workers_dev = false` disables the public `<name>.<account>.workers.dev`
# URL so identity headers (`X-Tenant-Id`, `X-User-Id`, `X-Scope`,
# `X-MCP-Session-Id`) cannot be spoofed by external callers.
workers_dev = false

[dev]
ip = "127.0.0.1"
port = 8788
inspector_port = 9788

# Indie platform DB — same `flowpunk-indie` D1 the gateway binds (ADR-011
# §Tenancy: indie is single-D1). Phase 2 does not query it; declared so the
# Phase 3 accounts entity work doesn't require a wrangler change.
[[d1_databases]]
binding = "DB"
database_name = "flowpunk-indie"
database_id = "placeholder-flowpunk-indie-db"
migrations_dir = "../../packages/db/migrations"

[vars]
# Unhashed prefix prepended to idempotency cache keys so the three indie
# services can share a single consolidated `IDEMPOTENCY_KV` namespace and
# still be listable per-service via `wrangler kv key list --prefix
# idem:contacts:`. Managed wranglers leave this var unset so managed
# cache keys stay byte-identical to today.
IDEMPOTENCY_KEY_PREFIX = "contacts:"

# Idempotency cache for mutation handlers — keyed per
# (tenant, user, method, path, idempotency-key) with body-hash binding.
# Default TTL 24h. See @flowpunk/service-utils withIdempotency.
# Consolidated across indie services per ADR-017 (KV inventory 6 → 4);
# isolation is preserved by IDEMPOTENCY_KEY_PREFIX above.
[[kv_namespaces]]
binding = "IDEMPOTENCY_KV"
id = "placeholder-indie-idempotency-kv"
